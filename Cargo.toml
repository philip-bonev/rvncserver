[package]
name = "rvncserver"
version = "0.1.6"
description = "A lightweight VNC server for Wayland desktops"
authors = ["Philip Bonev"]
license = "Apache-2.0"
repository = "https://github.com/philip-bonev/rvncserver.git"
edition = "2024"
rust-version = "1.87"

[dependencies]
ashpd = { version = "0.13.13", features = ["remote_desktop"] }
lamco-portal = "0.4.5"
lamco-pipewire = "0.8.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
des = "0.8.1"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
wayrs-client = "1.3.1"
wayrs-protocols = { version = "0.14.11", features = ["ext-data-control-v1"] }
crypto-bigint = { version = "0.7.8", features = ["alloc", "zeroize"] }
aes = "0.9.2"
md-5 = "0.11.0"
libc = "0.2.191"

[package.metadata.deb]
maintainer = "Philip Bonev"
copyright = "2026, Philip Bonev"
license-file = ["LICENSE", "0"]
section = "net"
depends = "$auto, xdg-desktop-portal"
assets = ["$auto"]
